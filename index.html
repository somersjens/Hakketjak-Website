<!DOCTYPE html>
<html lang="nl" data-title-nl="Hakketjak" data-title-en="Hakketjak" data-description-nl="Easy to use iOS apps, built by Jens Somers." data-description-en="Easy to use iOS apps, built by Jens Somers.">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hakketjak</title>
  <meta name="description" content="Easy to use iOS apps, built by Jens Somers.">
  <meta name="theme-color" content="#f4f5f7">
  <link rel="icon" type="image/png" href="/assets/dino-time/app-icon-for-promo.png">

<body class="home">
  <div class="language-shell">
    <div class="language-control">
      <div class="language-select-wrap">
        <select id="app-select" aria-label="App">
          <option value="/" data-label-nl="Alle apps" data-label-en="All apps" selected>Alle apps</option>
          <option value="/dino-time/" data-label-nl="Dino Time" data-label-en="Dino Time">Dino Time</option>
        </select>
      </div>
      <div class="language-select-wrap">
        <select id="language-select" aria-label="Taal">
          <option value="nl">🇳🇱 Nederlands</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>
    </div>
  </div>

  <main class="container">
    <section aria-labelledby="home-title">
      <article class="card hero-card">
        <h1 id="home-title">Easy to use iOS apps, built by <a href="https://www.linkedin.com/in/jenssomers/" target="_blank" rel="noopener noreferrer">Jens Somers</a></h1>
      </article>
    </section>

    <section aria-label="Apps">
      <ul class="app-grid">
        <li>
          <a class="card app-card" href="/dino-time/">

            <p class="en">A telling-time game for children, with dinosaurs, worlds, and levels.</p>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer class="container">
    <div class="footer">
      <div>© 2026 Hakketjak</div>
    </div>
  </footer>
  <script src="/assets/site.js?v=4"></script>
